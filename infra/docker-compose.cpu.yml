services:
  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    image: ai-pdf-reader-api:local
    container_name: pdr-api
    working_dir: /app
    volumes:
      - ../api:/app
      - ../data/uploads:/data/uploads
      - ../data/exports:/data/exports
      - ../data/logs:/data/logs
    environment:
      - PDR_ENV=${PDR_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - APP_AUTH_ENABLED=${APP_AUTH_ENABLED:-false}
      - APP_BOOTSTRAP_USERNAME=${APP_BOOTSTRAP_USERNAME:-}
      - APP_BOOTSTRAP_PASSWORD=${APP_BOOTSTRAP_PASSWORD:-}
      - APP_BOOTSTRAP_DISPLAY_NAME=${APP_BOOTSTRAP_DISPLAY_NAME:-}
      - APP_SESSION_TTL_HOURS=${APP_SESSION_TTL_HOURS:-12}
      - VENDOC_MSSQL_ENABLED=${VENDOC_MSSQL_ENABLED:-false}
      - VENDOC_MSSQL_HOST=${VENDOC_MSSQL_HOST:-}
      - VENDOC_MSSQL_PORT=${VENDOC_MSSQL_PORT:-1433}
      - VENDOC_MSSQL_DATABASE=${VENDOC_MSSQL_DATABASE:-SRTemp}
      - VENDOC_MSSQL_USER=${VENDOC_MSSQL_USER:-}
      - VENDOC_MSSQL_PASSWORD=${VENDOC_MSSQL_PASSWORD:-}
      - VENDOC_MSSQL_ENCRYPT=${VENDOC_MSSQL_ENCRYPT:-true}
      - VENDOC_MSSQL_TRUST_SERVER_CERTIFICATE=${VENDOC_MSSQL_TRUST_SERVER_CERTIFICATE:-false}
      - VENDOC_MSSQL_TIMEOUT_SECONDS=${VENDOC_MSSQL_TIMEOUT_SECONDS:-30}
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: pdr-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pg_data:
